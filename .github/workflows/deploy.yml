name: Build and deploy TBI-Insights to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell the main TBI KSA site to rebuild so its "From TBI Research" band picks
  # up whatever just published here. No-ops until SITE_DISPATCH_TOKEN (a PAT with
  # repo scope on tbi-ksa/tbi-ksa.github.io) is set as a repo secret.
  notify-site:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fire insights_updated dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN not set — skipping cross-repo rebuild trigger."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/tbi-ksa/tbi-ksa.github.io/dispatches \
            -d '{"event_type":"insights_updated"}'
